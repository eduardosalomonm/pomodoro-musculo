name: Validate app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser checks
        run: |
          python3 -m http.server 5181 --bind 127.0.0.1 > /tmp/pomodoro-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5181/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
